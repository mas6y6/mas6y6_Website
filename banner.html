<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    #background {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
    }

    #background canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40vh;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .banner img {
      height: 40%;
      max-height: 150px;
      width: auto;
    }

    @media (max-width: 1400px) {
      .banner {
        height: 25vh;
      }

      .banner img {
        height: 50%;
        max-height: 80px;
      }
    }

    @media (max-width: 800px) {
      .banner img {
        height: 30%;
      }
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <!-- <div class="banner">
    <img src="public/assets/banner.png" alt="banner" />
  </div> -->

  <script async>
    const holder = document.getElementById("background");
    const canvas = document.createElement("canvas");
    const VERT_SRC = await fetch("/src/shaders/neuralNoise.vert.glsl").then(function (res) {
        return res.text();
    });
    const FRAG_SRC = await fetch("/src/shaders/neuralNoise.frag.glsl").then(function (res) {
        return res.text();
    });

    holder.appendChild(canvas);

    let gl =
      canvas.getContext("webgl", { antialias: true, alpha: true }) ||
      canvas.getContext("experimental-webgl");

    if (!gl) {
      document.body.style.background = "#000";
      document.body.innerHTML = '<p style="color:#fff;padding:20px;font-family:sans-serif;">WebGL not supported.</p>';
    } else {
      let program = null;
      let frameId = null;
      let devicePixelRatio = 1;

      const pointer = { x: 0.5, y: 0.5, targetX: 0.5, targetY: 0.5 };
      const state = { uniforms: {}, startTime: 0 };

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        if (!shader) return null;
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error("Shader compile error:", gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function init() {
        const vertexShader = compileShader(gl.VERTEX_SHADER, VERT_SRC);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
        if (!vertexShader || !fragmentShader) return;

        program = gl.createProgram();
        if (!program) return;

        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error("Program link error:", gl.getProgramInfoLog(program));
          program = null;
          return;
        }

        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);

        gl.useProgram(program);
        const seed = Math.random() * 1000;
        gl.uniform1f(gl.getUniformLocation(program, "u_seed"), seed);

        const positionLocation = gl.getAttribLocation(program, "a_position");
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW
        );
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(positionLocation);

        state.uniforms = {
          u_time: gl.getUniformLocation(program, "u_time"),
          u_ratio: gl.getUniformLocation(program, "u_ratio"),
          u_pointer_position: gl.getUniformLocation(program, "u_pointer_position"),
          u_scroll_progress: gl.getUniformLocation(program, "u_scroll_progress"),
        };

        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        resize();
      }

      function resize() {
        devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        const width = holder.offsetWidth || window.innerWidth;
        const height = holder.offsetHeight || window.innerHeight;

        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        gl.viewport(0, 0, canvas.width, canvas.height);

        if (state.uniforms.u_ratio) {
          gl.uniform1f(
            state.uniforms.u_ratio,
            canvas.width / canvas.height
          );
        }
      }

      function renderFrame(now) {
        if (!gl || !program) return;

        pointer.x += (pointer.targetX - pointer.x) * 0.05;
        pointer.y += (pointer.targetY - pointer.y) * 0.05;

        const scrollMax = Math.max(
          document.body.scrollHeight - window.innerHeight,
          1
        );
        const scrollProgress = Math.min(window.scrollY / scrollMax, 1);
        const elapsed = now - state.startTime;

        gl.uniform1f(state.uniforms.u_time, elapsed);
        gl.uniform2f(state.uniforms.u_pointer_position, pointer.x, pointer.y);
        gl.uniform1f(state.uniforms.u_scroll_progress, scrollProgress);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        frameId = requestAnimationFrame(renderFrame);
      }

      const handlePointerMove = (event) => {
        pointer.targetX = event.clientX / window.innerWidth;
        pointer.targetY = 1 - event.clientY / window.innerHeight;
      };
      const handleTouchMove = (event) => {
        if (!event.touches?.length) return;
        const touch = event.touches[0];
        pointer.targetX = touch.clientX / window.innerWidth;
        pointer.targetY = 1 - touch.clientY / window.innerHeight;
      };

      window.addEventListener("pointermove", handlePointerMove, { passive: true });
      window.addEventListener("touchmove", handleTouchMove, { passive: true });
      window.addEventListener("resize", resize, { passive: true });

      init();
      if (program) {
        state.startTime = performance.now();
        frameId = requestAnimationFrame(renderFrame);
      }
    }
  </script>
</body>
</html>
