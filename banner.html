<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>background</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }

        #background canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .banner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 40vh;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .banner img {
            height: 40%;
            max-height: 150px;
            width: auto;
        }

        @media (max-width: 1400px) {
            .banner {
                height: 25vh;
            }

            .banner img {
                height: 50%;
                max-height: 80px;
            }
        }

        @media (max-width: 800px) {
            .banner img {
                height: 30%;
            }
        }
    </style>
</head>

<body>
<div id="background"></div>

<!--
<div class="banner">
  <img src="/assets/banner.png" alt="banner" />
</div>
-->

<script>
    async function loadShader(path) {
        const response = await fetch(path);

        if (!response.ok) {
            throw new Error(
                `Failed to load shader "${path}": HTTP ${response.status}`
            );
        }

        return response.text();
    }

    async function main() {
        const holder = document.getElementById("background");

        if (!holder) {
            throw new Error("Background element not found.");
        }

        const [VERT_SRC, FRAG_SRC] = await Promise.all([
            loadShader("/src/shaders/neuralNoise.vert.glsl"),
            loadShader("/src/shaders/neuralNoise.frag.glsl")
        ]);

        const canvas = document.createElement("canvas");
        holder.appendChild(canvas);

        const gl =
            canvas.getContext("webgl", {
                antialias: true,
                alpha: true
            }) ||
            canvas.getContext("experimental-webgl");

        if (!gl) {
            document.body.style.background = "#000";
            document.body.innerHTML =
                '<p style="color:#fff;padding:20px;font-family:sans-serif;">WebGL not supported.</p>';
            return;
        }

        let program = null;
        let frameId = null;
        let devicePixelRatio = 1;

        const state = {
            uniforms: {},
            startTime: 0
        };

        function compileShader(type, source) {
            const shader = gl.createShader(type);

            if (!shader) {
                console.error("Unable to create shader.");
                return null;
            }

            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(
                    "Shader compile error:",
                    gl.getShaderInfoLog(shader)
                );

                gl.deleteShader(shader);
                return null;
            }

            return shader;
        }

        function resize() {
            devicePixelRatio = Math.min(
                window.devicePixelRatio || 1,
                1.5
            );

            const width = holder.offsetWidth || window.innerWidth;
            const height = holder.offsetHeight || window.innerHeight;

            canvas.width = Math.round(width * devicePixelRatio);
            canvas.height = Math.round(height * devicePixelRatio);

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            gl.viewport(0, 0, canvas.width, canvas.height);

            if (program) {
                gl.useProgram(program);

                const ratioLocation = state.uniforms.u_ratio;

                if (ratioLocation !== null) {
                    gl.uniform1f(
                        ratioLocation,
                        canvas.width / canvas.height
                    );
                }
            }
        }

        function init() {
            const vertexShader = compileShader(
                gl.VERTEX_SHADER,
                VERT_SRC
            );

            const fragmentShader = compileShader(
                gl.FRAGMENT_SHADER,
                FRAG_SRC
            );

            if (!vertexShader || !fragmentShader) {
                if (vertexShader) gl.deleteShader(vertexShader);
                if (fragmentShader) gl.deleteShader(fragmentShader);
                return false;
            }

            program = gl.createProgram();

            if (!program) {
                console.error("Unable to create WebGL program.");

                gl.deleteShader(vertexShader);
                gl.deleteShader(fragmentShader);

                return false;
            }

            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);

            gl.deleteShader(vertexShader);
            gl.deleteShader(fragmentShader);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(
                    "Program link error:",
                    gl.getProgramInfoLog(program)
                );

                gl.deleteProgram(program);
                program = null;

                return false;
            }

            gl.useProgram(program);

            const seedLocation = gl.getUniformLocation(
                program,
                "u_seed"
            );

            if (seedLocation !== null) {
                gl.uniform1f(seedLocation, Math.random() * 1000);
            }

            const positionLocation = gl.getAttribLocation(
                program,
                "a_position"
            );

            if (positionLocation < 0) {
                console.error("Attribute a_position was not found.");
                return false;
            }

            const buffer = gl.createBuffer();

            if (!buffer) {
                console.error("Unable to create vertex buffer.");
                return false;
            }

            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array([
                    -1, -1,
                    1, -1,
                    -1,  1,
                    1,  1
                ]),
                gl.STATIC_DRAW
            );

            gl.vertexAttribPointer(
                positionLocation,
                2,
                gl.FLOAT,
                false,
                0,
                0
            );

            gl.enableVertexAttribArray(positionLocation);

            state.uniforms = {
                u_time: gl.getUniformLocation(program, "u_time"),
                u_ratio: gl.getUniformLocation(program, "u_ratio"),
                u_pointer_position: gl.getUniformLocation(
                    program,
                    "u_pointer_position"
                ),
                u_scroll_progress: gl.getUniformLocation(
                    program,
                    "u_scroll_progress"
                )
            };

            gl.disable(gl.DEPTH_TEST);

            gl.enable(gl.BLEND);
            gl.blendFunc(
                gl.SRC_ALPHA,
                gl.ONE_MINUS_SRC_ALPHA
            );

            resize();

            return true;
        }

        function renderFrame(now) {
            if (!gl || !program) return;

            const scrollMax = Math.max(
                document.body.scrollHeight - window.innerHeight,
                1
            );

            const scrollProgress = Math.min(
                window.scrollY / scrollMax,
                1
            );

            // Convert milliseconds to seconds.
            const elapsed = now - state.startTime;

            if (state.uniforms.u_time !== null) {
                gl.uniform1f(
                    state.uniforms.u_time,
                    elapsed
                );
            }

            if (state.uniforms.u_scroll_progress !== null) {
                gl.uniform1f(
                    state.uniforms.u_scroll_progress,
                    scrollProgress
                );
            }

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            frameId = requestAnimationFrame(renderFrame);
        }

        window.addEventListener(
            "resize",
            resize,
            { passive: true }
        );

        if (init()) {
            state.startTime = performance.now();
            frameId = requestAnimationFrame(renderFrame);
        } else {
            console.error("WebGL initialization failed.");
        }
    }

    // Start the application exactly once.
    main().catch(error => {
        console.error("Background initialization failed:", error);
    });
</script>
</body>
</html>
